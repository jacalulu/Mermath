<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mermath: treasure chest</title>
<!-- Static reference exported from the Mermath storyboard. Design space is 800x600. Open in a browser to see the layers and motion; scale the stage to fit the device in the real build. -->
<style>@font-face{font-family:'Baloo 2';font-weight:500;font-display:swap;src:url(../../assets/fonts/baloo-2-latin-500.woff2) format('woff2')}@font-face{font-family:'Baloo 2';font-weight:600;font-display:swap;src:url(../../assets/fonts/baloo-2-latin-600.woff2) format('woff2')}@font-face{font-family:'Baloo 2';font-weight:700;font-display:swap;src:url(../../assets/fonts/baloo-2-latin-700.woff2) format('woff2')}</style>
<style>
body{margin:0}
a{color:#061A33}a:hover{color:#061A33}
@keyframes mmFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes mmHairL{from{transform:rotate(-1.6deg)}to{transform:rotate(1.8deg)}}
@keyframes mmTail{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes mmFluke{from{transform:rotate(-10deg)}to{transform:rotate(9deg)}}
@keyframes mmArm{from{transform:rotate(-7deg)}to{transform:rotate(11deg)}}
@keyframes mmOpen{0%,92%{opacity:1}94%,98%{opacity:0}100%{opacity:1}}
@keyframes mmShut{0%,92%{opacity:0}94%,98%{opacity:1}100%{opacity:0}}
@keyframes mmSwayFar{from{transform:skewX(-0.8deg)}to{transform:skewX(0.9deg)}}
@keyframes mmSwayMid{from{transform:skewX(1.3deg)}to{transform:skewX(-1.4deg)}}
@keyframes mmSwayLeft{from{transform:skewX(-1.7deg)}to{transform:skewX(1.3deg)}}
@keyframes mmSwayRight{from{transform:skewX(1.5deg)}to{transform:skewX(-1.4deg)}}
@keyframes mmGrass{from{transform:skewX(-7deg)}to{transform:skewX(7deg)}}
@keyframes mmRise{0%{transform:translate(0,0);opacity:0}8%{opacity:.9}50%{transform:translate(9px,-300px)}92%{opacity:.8}100%{transform:translate(-4px,-640px);opacity:0}}
@keyframes mmLight{from{opacity:.05}to{opacity:.45}}
@keyframes mmGlow{from{opacity:.45;transform:scale(.94)}to{opacity:1;transform:scale(1.05)}}
@keyframes mmLamp{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(5deg)}}
@keyframes mmTwinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@media (prefers-reduced-motion: no-preference){
.mm-float1{animation:mmFloat 3.6s ease-in-out infinite}
.mm-hairL{animation:mmHairL 3s ease-in-out infinite alternate}
.mm-tail1{animation:mmTail 2.4s ease-in-out infinite alternate}
.mm-fluke1{animation:mmFluke 1.2s ease-in-out infinite alternate}
.mm-arm1{animation:mmArm 1.1s ease-in-out infinite alternate}
.mm-open1{animation:mmOpen 4.4s linear infinite}.mm-shut1{animation:mmShut 4.4s linear infinite}
.mm-swayFar{animation:mmSwayFar 7s ease-in-out infinite alternate}
.mm-swayMid{animation:mmSwayMid 6s ease-in-out infinite alternate}
.mm-swayLeft{animation:mmSwayLeft 5s ease-in-out infinite alternate}
.mm-swayRight{animation:mmSwayRight 5.6s ease-in-out infinite alternate}
.mm-grass{animation:mmGrass 2.8s ease-in-out infinite alternate}
.mm-rise1{animation:mmRise 9s linear infinite}
.mm-rise2{animation:mmRise 12s linear 3s infinite}
.mm-light{animation:mmLight 4.5s ease-in-out infinite alternate}
.mm-glow{animation:mmGlow 1.8s ease-in-out infinite alternate}
.mm-lamp{animation:mmLamp 3.4s ease-in-out infinite}
.mm-tw1{animation:mmTwinkle 2.2s ease-in-out infinite}.mm-tw2{animation:mmTwinkle 2.6s ease-in-out .7s infinite}.mm-tw3{animation:mmTwinkle 2s ease-in-out 1.2s infinite}.mm-tw4{animation:mmTwinkle 2.8s ease-in-out .3s infinite}.mm-tw5{animation:mmTwinkle 2.4s ease-in-out 1.6s infinite}
}
</style>
<style>html,body{height:100%}body{display:grid;place-items:center;background:#061A33}</style>
</head>
<body>
<div style="width: 800px; height: 600px; box-sizing: border-box; position: relative; overflow: hidden; background: #167C9B; font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif; color: #FFF4DC">

<svg aria-hidden="true" class="mm-tw3" viewBox="0 0 20 20" style="position: absolute; left: 486px; top: 132px; width: 20px; height: 20px"><path d="M10 0 L12 8 L20 10 L12 12 L10 20 L8 12 L0 10 L8 8 Z" fill="#FFF4DC"></path></svg>
<svg aria-hidden="true" class="mm-tw4" viewBox="0 0 20 20" style="position: absolute; left: 304px; top: 150px; width: 16px; height: 16px"><path d="M10 0 L12 8 L20 10 L12 12 L10 20 L8 12 L0 10 L8 8 Z" fill="#FFF4DC"></path></svg>
<svg aria-hidden="true" class="mm-tw5" viewBox="0 0 20 20" style="position: absolute; left: 392px; top: 318px; width: 16px; height: 16px"><path d="M10 0 L12 8 L20 10 L12 12 L10 20 L8 12 L0 10 L8 8 Z" fill="#FFFFFF"></path></svg>

<span class="mm-tail1" style="position: absolute; left: 0; top: 0; width: 230px; height: 264px; display: block; transform-origin: 48.5% 61.5%">
<img class="mm-fluke1" src="../../assets/characters/ophelia/fluke.png" alt="" style="position: absolute; left: 0; top: 0; width: 230px; height: 264px; max-width: none; transform-origin: 72.5% 84.6%">
<img src="../../assets/characters/ophelia/tail.png" alt="" style="position: absolute; left: 0; top: 0; width: 230px; height: 264px; max-width: none">
</span>

</span>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 800px; height: 600px; background: radial-gradient(ellipse at 50% 45%, rgba(2,8,20,0) 55%, rgba(2,8,20,0.32) 100%); pointer-events: none"></div>
