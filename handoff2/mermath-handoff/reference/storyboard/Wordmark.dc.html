<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wordmark and icon</title>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes wmTail{from{transform:rotate(-1.6deg)}to{transform:rotate(2deg)}}
@keyframes wmFin{from{transform:rotate(-8deg)}to{transform:rotate(5deg)}}
@keyframes wmPlus{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: no-preference){
.wm-tail{animation:wmTail 2.6s ease-in-out infinite alternate}
.wm-fin{animation:wmFin 1.3s ease-in-out infinite alternate}
.wm-plus{animation:wmPlus 2.4s ease-in-out infinite}
}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; background: #FFF4DC; font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif; color: #061A33; padding: 32px 40px; display: flex; flex-direction: column; justify-content: center; gap: 36px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #17617A">Wordmark</span>
<span role="img" aria-label="Mermath wordmark in a soft navy serif. The t is an orange plus sign, and the stem of the h beside it rises and narrows into a painted mermaid tail, fading from navy through violet into a pink fin" style="position: relative; display: block; width: 612px; height: 206px; align-self: center">
<img src="/_blob/5f5ea5bda889e8561700202e736c667a" alt="" style="position: absolute; left: 0; top: 0; width: 612px; height: 206px; max-width: none">
<img class="wm-plus" src="/_blob/30cfccb044799f040ef2096fcaaf6b58" alt="" style="position: absolute; left: 0; top: 0; width: 612px; height: 206px; max-width: none; transform-origin: 79.9% 80%">
<span class="wm-tail" style="position: absolute; left: 0; top: 0; width: 612px; height: 206px; display: block; transform-origin: 89.7% 64.4%">
<img class="wm-fin" src="/_blob/f9a6b9f505df8d8949e3831ba693fd95" alt="" style="position: absolute; left: 0; top: 0; width: 612px; height: 206px; max-width: none; transform-origin: 94% 27.7%">
<img src="/_blob/29924a1394dbe9d90db13f7aa74312fc" alt="" style="position: absolute; left: 0; top: 0; width: 612px; height: 206px; max-width: none">
</span>
</span>
</div>
<div style="display: grid; grid-template-columns: 300px 200px minmax(0, 1fr); gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #17617A">On the painting</span>
<div style="position: relative; height: 196px; border-radius: 22px; overflow: hidden; background: #95DFDA">
<img src="/_blob/85f2769c8ea6bce745b4b248d5cb2777" alt="" style="position: absolute; left: -60px; top: -10px; width: 420px; height: 315px; max-width: none">
<img src="/_blob/e6f82b01f2b860112cd5382ee65d7ca1" alt="" style="position: absolute; left: 33px; top: 56px; width: 234px; height: 79px; max-width: none">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #17617A">Reversed</span>
<div style="height: 196px; border-radius: 22px; background: #061A33; display: flex; align-items: center; justify-content: center">
<img src="/_blob/59c582967524124fb18cfe9be6e91197" alt="" style="width: 156px; height: 52px; max-width: none">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #17617A">App icon</span>
<div style="height: 196px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">

<div style="display: flex; align-items: flex-end; gap: 16px">
<img src="/_blob/a3e947ad385b9c6d9a95f4276fd787a6" alt="" style="width: 52px; height: 52px">
<img src="/_blob/a3e947ad385b9c6d9a95f4276fd787a6" alt="" style="width: 32px; height: 32px">
</div>
</div>
</div>
</div>
</div>
