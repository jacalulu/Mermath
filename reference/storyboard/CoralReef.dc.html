<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coral Reef dive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFE9BF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C4F70; font-family: 'Nunito', system-ui, sans-serif; color: #FFFFFF; padding: 24px 40px; display: flex; flex-direction: column; gap: 14px">
<img src="/_blob/c2f334d1c55ea2f929d229744aa6932c" alt="" style="position: absolute; left: 0; top: 0; width: 800px; height: 600px; object-fit: cover">
<div style="position: relative; display: flex; align-items: center; justify-content: space-between">
<a href="Map.dc.html" style="background: rgba(6,26,50,0.66); border: 1.5px solid rgba(255,214,140,0.75); color: #FFF1D2; text-decoration: none; font-weight: 800; font-size: 17px; padding: 9px 20px; border-radius: 999px">Map</a>
<div style="display: flex; align-items: center; gap: 8px; background: rgba(6,26,50,0.66); border: 1.5px solid rgba(255,214,140,0.75); padding: 9px 18px; border-radius: 999px">
<span style="color: #FFF1D2; font-weight: 800; font-size: 17px">Pearls</span>
<sc-for list="{{pearls}}" as="p" hint-placeholder-count="10">
<span style="width: 17px; height: 17px; border-radius: 50%; background: {{p.bg}}; box-shadow: {{p.glow}}; border: 1.5px solid rgba(255,241,210,0.8); box-sizing: border-box"></span>
</sc-for>
</div>
</div>
<div style="position: relative; background: rgba(6,26,50,0.58); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1.5px solid rgba(255,214,140,0.75); border-radius: 32px; padding: 12px 26px 14px; display: flex; align-items: center; justify-content: center; gap: 22px; box-shadow: 0 0 28px rgba(110,230,220,0.3), inset 0 0 24px rgba(110,230,220,0.14)">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="display: flex; gap: 4px">
<img src="/_blob/c514494140f64366a6c18194b200d8fa" alt="Orange shell" style="width: 52px; height: 42px; filter: drop-shadow(0 0 8px rgba(255,150,70,0.8))">
<img src="/_blob/c514494140f64366a6c18194b200d8fa" alt="Orange shell" style="width: 52px; height: 42px; filter: drop-shadow(0 0 8px rgba(255,150,70,0.8))">
<img src="/_blob/c514494140f64366a6c18194b200d8fa" alt="Orange shell" style="width: 52px; height: 42px; filter: drop-shadow(0 0 8px rgba(255,150,70,0.8))">
</div>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 74px; line-height: 1; color: #FFF1D2">3</span>
</div>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 68px; line-height: 1; align-self: flex-end; color: #BFEFEA">+</span>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="display: flex; gap: 4px">
<img src="/_blob/e16f89315d20cc946f7b0d3447d4c409" alt="Teal shell" style="width: 52px; height: 42px; filter: drop-shadow(0 0 8px rgba(120,235,225,0.8))">
<img src="/_blob/e16f89315d20cc946f7b0d3447d4c409" alt="Teal shell" style="width: 52px; height: 42px; filter: drop-shadow(0 0 8px rgba(120,235,225,0.8))">
</div>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 74px; line-height: 1; color: #FFF1D2">2</span>
</div>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 68px; line-height: 1; align-self: flex-end; color: #BFEFEA">=</span>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 70px; line-height: 1.1; align-self: flex-end; min-width: 80px; text-align: center; background: linear-gradient(180deg, #FFD58A, #FF9A3D); color: #06213A; border-radius: 20px; padding: 0 12px; box-shadow: 0 0 24px rgba(255,170,80,0.8)">{{answer}}</span>
<button aria-label="Say it again" style="width: 54px; height: 54px; border-radius: 50%; border: 1.5px solid rgba(225,250,248,0.9); background: rgba(120,235,225,0.25); display: flex; align-items: center; justify-content: center; align-self: center">
<svg aria-hidden="true" viewBox="0 0 24 24" style="width: 26px; height: 26px" fill="none" stroke="#FFFFFF"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" style="stroke-width: 2.2px; stroke-linejoin: round"></path><path d="M16.5 9 a4 4 0 0 1 0 6" style="stroke-width: 2.2px; stroke-linecap: round"></path><path d="M19 6.5 a8 8 0 0 1 0 11" style="stroke-width: 2.2px; stroke-linecap: round"></path></svg>
</button>
</div>
<div style="position: relative; display: flex; justify-content: center; gap: 40px; flex-grow: 1; align-items: center">
<sc-for list="{{bubbles}}" as="b" hint-placeholder-count="3">
<button onClick="{{b.pick}}" style="width: 136px; height: 136px; border-radius: 50%; border: 2.5px solid rgba(235,253,250,0.95); background: {{b.bg}}; color: #FFFFFF; opacity: {{b.opacity}}; font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 76px; line-height: 1; box-shadow: {{b.glow}}; text-shadow: 0 3px 12px #062238">{{b.n}}</button>
</sc-for>
</div>
<div style="position: relative; height: 76px; display: flex; align-items: center; justify-content: center">
<sc-if value="{{showHint}}" hint-placeholder-val="{{false}}">
<div style="background: rgba(6,26,50,0.8); border: 1.5px solid rgba(255,214,140,0.75); border-radius: 24px; padding: 12px 24px; font-weight: 800; font-size: 21px; color: #FFF1D2">Count all the shells: 1, 2, 3 and then 4, 5</div>
</sc-if>
<sc-if value="{{solved}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 16px; background: rgba(6,26,50,0.8); border: 1.5px solid rgba(255,214,140,0.75); border-radius: 999px; padding: 10px 12px 10px 26px">
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 26px; color: #FFF1D2">3 and 2 make 5! That is 10 pearls.</span>
<a href="Chest.dc.html" style="background: linear-gradient(180deg, #FFD58A, #FF9A3D); color: #06213A; text-decoration: none; font-weight: 800; font-size: 21px; padding: 13px 24px; border-radius: 999px; box-shadow: 0 0 22px rgba(255,170,80,0.8)">Open the chest</a>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const solved = s.picked === 5;
const wrong = s.wrong || {};
const filled = solved ? 10 : 9;
const orb = 'radial-gradient(circle at 32% 28%, rgba(255,255,255,0.88) 0%, rgba(150,240,235,0.5) 26%, rgba(16,96,140,0.55) 72%)';
const gold = 'radial-gradient(circle at 32% 28%, rgba(255,255,255,0.9) 0%, rgba(255,213,138,0.92) 28%, rgba(255,140,50,0.9) 75%)';
return {
solved: solved,
answer: solved ? '5' : '?',
showHint: !solved && Object.keys(wrong).length > 0,
pearls: Array.from({ length: 10 }, (_, i) => ({ bg: i < filled ? '#FFF6EC' : 'rgba(255,255,255,0.1)', glow: i < filled ? '0 0 10px rgba(255,241,210,0.9)' : 'none' })),
bubbles: [4, 5, 6].map((n) => ({
n: n,
bg: solved && n === 5 ? gold : orb,
glow: solved && n === 5 ? '0 0 44px rgba(255,180,90,0.95), inset 0 0 26px rgba(255,255,255,0.4)' : '0 0 34px rgba(120,235,225,0.75), inset 0 0 26px rgba(255,255,255,0.35)',
opacity: wrong[n] ? '0.4' : '1',
pick: () => {
if (n === 5) this.setState({ picked: 5 });
else this.setState({ wrong: Object.assign({}, wrong, { [n]: true }) });
}
}))
};
}
}
</script>
</body>
</html>
