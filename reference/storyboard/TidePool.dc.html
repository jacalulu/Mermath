<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tide Pool dive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFE9BF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; position: relative; overflow: hidden; background: #1B819D; font-family: 'Nunito', system-ui, sans-serif; color: #FFFFFF; padding: 24px 40px; display: flex; flex-direction: column; gap: 10px">
<img src="/_blob/b945d0cb9fea76f20bdb1900c84a73af" alt="" style="position: absolute; left: 0; top: 0; width: 800px; height: 600px; object-fit: cover">
<div style="position: relative; display: flex; align-items: center; justify-content: space-between">
<a href="Map.dc.html" style="background: rgba(6,26,50,0.66); border: 1.5px solid rgba(255,214,140,0.75); color: #FFF1D2; text-decoration: none; font-weight: 800; font-size: 17px; padding: 9px 20px; border-radius: 999px">Map</a>
<div style="display: flex; align-items: center; gap: 8px; background: rgba(6,26,50,0.66); border: 1.5px solid rgba(255,214,140,0.75); padding: 9px 18px; border-radius: 999px">
<span style="color: #FFF1D2; font-weight: 800; font-size: 17px">Pearls</span>
<sc-for list="{{pearls}}" as="p" hint-placeholder-count="10">
<span style="width: 17px; height: 17px; border-radius: 50%; background: {{p.bg}}; box-shadow: {{p.glow}}; border: 1.5px solid rgba(255,241,210,0.8); box-sizing: border-box"></span>
</sc-for>
</div>
</div>
<div style="position: relative; display: flex; align-items: center; gap: 6px">
<img src="/_blob/a7197132e309854e8e4c3a4de4a1f3fa" alt="A friendly orange crab waving a claw" style="width: 236px; height: 199px; max-width: none; flex-shrink: 0; margin: -26px -12px -36px -24px; filter: drop-shadow(0 6px 14px rgba(6,40,60,0.45))">
<div style="background: rgba(6,26,50,0.62); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1.5px solid rgba(255,214,140,0.75); border-radius: 28px; padding: 12px 22px; display: flex; align-items: center; gap: 18px; flex-grow: 1; box-shadow: 0 0 28px rgba(110,230,220,0.3)">
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 46px; line-height: 1.1; flex-grow: 1; color: #FFF1D2">Find the 4!</span>
<button aria-label="Say it again" style="width: 58px; height: 58px; border-radius: 50%; border: none; background: linear-gradient(180deg, #FFD58A, #FF9A3D); box-shadow: 0 0 20px rgba(255,170,80,0.8); display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" viewBox="0 0 24 24" style="width: 28px; height: 28px" fill="none" stroke="#06213A"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" style="stroke-width: 2.2px; stroke-linejoin: round"></path><path d="M16.5 9 a4 4 0 0 1 0 6" style="stroke-width: 2.2px; stroke-linecap: round"></path><path d="M19 6.5 a8 8 0 0 1 0 11" style="stroke-width: 2.2px; stroke-linecap: round"></path></svg>
</button>
</div>
</div>
<div style="position: relative; display: flex; justify-content: center; gap: 44px; flex-grow: 1; align-items: center">
<sc-for list="{{bubbles}}" as="b" hint-placeholder-count="3">
<button onClick="{{b.pick}}" style="width: 150px; height: 150px; border-radius: 50%; border: 2.5px solid rgba(235,253,250,0.95); background: {{b.bg}}; color: #FFFFFF; opacity: {{b.opacity}}; font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 84px; line-height: 1; box-shadow: {{b.glow}}; text-shadow: 0 3px 12px #062238">{{b.n}}</button>
</sc-for>
</div>
<div style="position: relative; height: 84px; display: flex; align-items: center; justify-content: center">
<sc-if value="{{showHint}}" hint-placeholder-val="{{false}}">
<div style="background: rgba(6,26,50,0.78); border: 1.5px solid rgba(255,214,140,0.75); border-radius: 24px; padding: 12px 24px; display: flex; align-items: center; gap: 14px">
<span style="font-weight: 800; font-size: 22px; color: #FFF1D2">Count with me</span>
<span style="width: 26px; height: 26px; border-radius: 50%; background: #FF9A3D; box-shadow: 0 0 12px rgba(255,170,80,0.9)"></span>
<span style="width: 26px; height: 26px; border-radius: 50%; background: #FF9A3D; box-shadow: 0 0 12px rgba(255,170,80,0.9)"></span>
<span style="width: 26px; height: 26px; border-radius: 50%; background: #FF9A3D; box-shadow: 0 0 12px rgba(255,170,80,0.9)"></span>
<span style="width: 26px; height: 26px; border-radius: 50%; background: #FF9A3D; box-shadow: 0 0 12px rgba(255,170,80,0.9)"></span>
</div>
</sc-if>
<sc-if value="{{solved}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 16px; background: rgba(6,26,50,0.78); border: 1.5px solid rgba(255,214,140,0.75); border-radius: 999px; padding: 10px 12px 10px 26px">
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 28px; color: #FFF1D2">You found 4! That is 10 pearls.</span>
<a href="Chest.dc.html" style="background: linear-gradient(180deg, #FFD58A, #FF9A3D); color: #06213A; text-decoration: none; font-weight: 800; font-size: 21px; padding: 13px 24px; border-radius: 999px; box-shadow: 0 0 22px rgba(255,170,80,0.8)">Open the chest</a>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const solved = s.picked === 4;
const wrong = s.wrong || {};
const filled = solved ? 10 : 9;
const orb = 'radial-gradient(circle at 32% 28%, rgba(255,255,255,0.9) 0%, rgba(150,240,235,0.55) 26%, rgba(16,96,140,0.62) 72%)';
const gold = 'radial-gradient(circle at 32% 28%, rgba(255,255,255,0.9) 0%, rgba(255,213,138,0.92) 28%, rgba(255,140,50,0.9) 75%)';
return {
solved: solved,
showHint: !solved && Object.keys(wrong).length > 0,
pearls: Array.from({ length: 10 }, (_, i) => ({ bg: i < filled ? '#FFF6EC' : 'rgba(255,255,255,0.1)', glow: i < filled ? '0 0 10px rgba(255,241,210,0.9)' : 'none' })),
bubbles: [2, 4, 7].map((n) => ({
n: n,
bg: solved && n === 4 ? gold : orb,
glow: solved && n === 4 ? '0 0 44px rgba(255,180,90,0.95), inset 0 0 26px rgba(255,255,255,0.4)' : '0 0 34px rgba(190,250,245,0.8), inset 0 0 26px rgba(255,255,255,0.4)',
opacity: wrong[n] ? '0.4' : '1',
pick: () => {
if (n === 4) this.setState({ picked: 4 });
else this.setState({ wrong: Object.assign({}, wrong, { [n]: true }) });
}
}))
};
}
}
</script>
</body>
</html>
