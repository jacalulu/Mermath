<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Treasure chest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFE9BF}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A1F44; font-family: 'Nunito', system-ui, sans-serif; color: #FFFFFF; padding: 26px 48px 26px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<img src="/_blob/fad06595da2f5049830b8e3eaab1ab1f" alt="An open treasure chest full of gold and pearls, with a glowing starfish lamp floating above it" style="position: absolute; left: 0; top: 0; width: 800px; height: 600px; object-fit: cover">
<h1 style="position: relative; margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 40px; line-height: 1.1; color: #FFF1D2; text-shadow: 0 2px 14px #040C1C, 0 0 26px rgba(255,200,110,0.55)">10 pearls! The chest is open.</h1>
<div style="position: relative; display: flex; gap: 9px">
<sc-for list="{{pearls}}" as="p" hint-placeholder-count="10">
<span style="width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #FFFFFF, #FFE9CF 60%, #E8C9A6); box-shadow: 0 0 12px rgba(255,241,210,0.9)"></span>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<div style="position: relative; display: flex; align-items: center; gap: 18px; background: rgba(6,20,44,0.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1.5px solid rgba(255,214,140,0.75); border-radius: 999px; padding: 9px 11px 9px 28px">
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 26px; color: #FFF1D2">You earned a starfish lamp</span>
<a href="Grotto.dc.html" style="background: linear-gradient(180deg, #FFD58A, #FF9A3D); color: #06213A; text-decoration: none; font-weight: 800; font-size: 21px; padding: 12px 26px; border-radius: 999px; box-shadow: 0 0 22px rgba(255,170,80,0.8)">Put it in my grotto</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return { pearls: Array.from({ length: 10 }, (_, i) => ({ i: i })) };
}
}
</script>
</body>
</html>
